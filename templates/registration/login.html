{% extends "base.html" %}

{% block title %}Login - TicketDesk{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 3rem auto;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Login TicketDesk</h2>
    {% if form.errors %}
        <p style="color: #dc2626; font-size: 0.9rem; text-align: center;">Incorrect username or password!</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_div }}
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </div>
    </form>
</div>
{% endblock %}
